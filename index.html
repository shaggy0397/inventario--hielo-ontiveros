<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INVENTARIO HIELO ONTIVEROS</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>INVENTARIO HIELO ONTIVEROS</h1>
  <p>powered by DEIMON ENTERPRISE technology</p>

  <div id="dashboard">
    <!-- Aquí va la tabla dinámica -->
    <table id="tablaInventario">
      <thead>
        <tr>
          <th>Producto</th>
          <th>Inicial</th>
          <th>Ingreso</th>
          <th>Contado</th>
          <th>Vendidos</th>
          <th>Dinero</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <div id="ajustesFinales">
      <label><input type="checkbox" id="desechable"> Desechable</label>
      <label><input type="checkbox" id="totalDinero"> Total de $</label>
      <p>Total: $<span id="totalFinal">0</span></p>
      <button onclick="calcularTotalFinal()">Calcular total final</button>
      <button onclick="cerrarDia()">Cerrar día</button>
      <button id="btnCaptura">Guardar captura</button>
    </div>

    <div id="calculadoraBarras">
      <h3>Calculadora de barras</h3>
      <input type="number" id="cantidadDinero" placeholder="Cantidad de $">
      <button onclick="convertirAKilos()">Convertir a kilos</button>
      <p>Kilos: <span id="resultadoKilos">0</span></p>
    </div>
  </div>

  <script src="html2canvas.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
