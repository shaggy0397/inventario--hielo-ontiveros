<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>INVENTARIO HIELO ONTIVEROS</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>INVENTARIO HIELO ONTIVEROS</h1>
  <p>powered by DEIMON ENTERPRISE technology</p>

  <div id="dashboard">
    <table id="tablaInventario">
      <thead>
        <tr>
          <th>Producto</th>
          <th>Inicial</th>
          <th>Ingreso</th>
          <th>Contado</th>
          <th>Vendidos</th>
          <th>Dinero</th>
        </tr>
      </thead>
    </table>

    <div id="ajustesFinales">
      <label>Desechable: <input type="number" id="desechable" value="15" /></label>
      <label>Gastos: <input type="number" id="gastos" value="0" /></label>
      <label>Fiados: <input type="number" id="fiados" value="0" /></label>
      <p>Total: $<span id="totalFinal">0</span></p>
      <button onclick="calcularTotalFinal()">Calcular total final</button>
      <button onclick="cerrarDia()">Cerrar día</button>
      <button id="btnCaptura">Guardar captura</button>
    </div>

    <div id="calculadoraBarras">
      <h3>Calculadora de barras</h3>
      <input type="number" id="barrasInput" placeholder="Cantidad de barras" />
      <button onclick="convertirBarrasAKilos()">Convertir a kilos</button>
    </div>
  </div>

  <script src="html2canvas.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
