<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventario Hielo Ontiveros</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
</head>
<body>
  <div id="dashboard">
    <h1>INVENTARIO HIELO ONTIVEROS</h1>
    <h3>powered by DEIMON ENTERPRISE technology</h3>

    <table id="tablaInventario">
      <tr>
        <th>Producto</th><th>Inicial</th><th>Ingreso</th><th>Contado</th><th>Vendidos</th><th>Dinero</th>
      </tr>
    </table>

    <div id="ajustesFinales">
      <h4>🧾 Ajustes finales</h4>
      <label>♻️ Desechable: <input type="number" id="desechable" value="0" /></label><br />
      <label>💸 Gastos: <input type="number" id="gastos" value="0" /></label><br />
      <label>🔄 Fiados: <input type="number" id="fiados" value="0" /></label><br />
      <button onclick="calcularTotalFinal()">🧮 Calcular total final</button>
      <h3 id="totalFinal">Total: $0</h3>
    </div>

    <button onclick="cerrarDia()">Cerrar día</button>
    <button id="capturaBtn">📸 Guardar captura</button>

    <div id="calculadoraBarras">
      <h4>🧊 Calculadora de barras</h4>
      <input type="number" id="barrasInput" placeholder="Cantidad de barras" />
      <button onclick="convertirBarrasAKilos()">🔄 Convertir a kilos</button>
    </div>
  </div>

  <script src="html2canvas.min.js"></script>
  <script src="script.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js")
      .then(() => console.log("✅ Service worker registrado"))
      .catch(err => console.error("❌ Error al registrar SW", err));
  }
</script>
</body>
</html>
